name: Publish Fluid UI Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs');const v=fs.readFileSync('VERSION','utf8').trim();const p=require('./package.json').version;const s=fs.readFileSync('skills/fluid-ui/VERSION','utf8').trim();if('v'+v!==process.env.RELEASE_TAG||p!==v||s!==v){console.error('Version mismatch', {tag:process.env.RELEASE_TAG,version:v,package:p,skill:s});process.exit(1)}"
      - run: npm test
      - run: npm run validate
      - run: npm audit --audit-level=moderate
      - run: npm run scan
      - name: Check script syntax
        shell: bash
        run: |
          bash -n scripts/install.sh
          for file in scripts/*.mjs demo/*.mjs; do node --check "$file"; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run package
      - name: Upload tested package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publish the exact archive the verify job tested instead of rebuilding it,
      # so the released checksum always describes the artifact that passed CI.
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Verify package checksum
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A release for this tag was created by hand (or by an earlier run of
            # this workflow), so `gh release create` would fail with
            # "a release with the same tag name already exists". Upload onto the
            # existing release instead, and keep its hand-written notes.
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
              --title "Fluid UI Skill $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
