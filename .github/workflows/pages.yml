name: Deploy demo site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'demo/**'
      - 'docs/**'
      - 'skills/fluid-ui/scripts/**'
      - 'scripts/build-site.mjs'
      - 'scripts/serve.mjs'
      - 'scripts/manage.mjs'
      - 'tests/site/**'
      - 'playwright.site.config.mjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Assemble and exercise the deployment artifact
        run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification
          path: test-results/site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
