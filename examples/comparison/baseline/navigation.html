<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目空间 · 青叶工作台</title><style>:root{font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f4f8f5;--accent:#176b45;--muted:#53675b;--line:#cbdad0}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid var(--line);border-radius:16px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #82998b;border-radius:8px;background:white;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:white;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #183fce;outline-offset:3px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:16px}.status{min-height:28px;margin-top:16px}.error{color:#a12620}.success{color:#176b45}a{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--accent);color:white}section[hidden]{display:none}dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid var(--line);border-radius:16px;color:inherit}dialog::backdrop{background:#12281c88}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:600}.table-wrap{overflow:auto}details{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}summary{cursor:pointer;min-height:32px;font-weight:600}details p{margin:16px 0 0}small{font-size:14px}.pill{display:inline-block;padding:0 8px;background:#e1f1e6;border-radius:16px}button,input,summary{transition:background-color .15s ease,border-color .15s ease}@media(max-width:480px){body{padding:16px 8px}main,dialog{padding:24px 16px}h1{font-size:24px}th,td{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><p class="muted">青叶工作台 / 交互实验</p><h1>项目空间</h1><p class="muted">切换视图时保留任务草稿。</p><nav aria-label="项目视图"><button data-view="overview" aria-current="page">概览</button><button data-view="tasks">任务</button><button data-view="settings">设置</button></nav><section id="overview" aria-labelledby="overview-title"><h2 id="overview-title" tabindex="-1">项目概览</h2><p>产品改版仍在进行中，下一步是完成表单可用性复核。</p><span class="pill">进行中</span></section><section id="tasks" hidden aria-labelledby="tasks-title"><h2 id="tasks-title" tabindex="-1">任务草稿</h2><label for="draft">下一个任务</label><input id="draft" placeholder="例如：检查键盘焦点顺序"><p class="muted">草稿在当前页面会话内保留。</p></section><section id="settings" hidden aria-labelledby="settings-title"><h2 id="settings-title" tabindex="-1">项目设置</h2><label for="project-name">项目名称</label><input id="project-name" value="产品体验改版"></section><p id="nav-status" role="status" class="status"></p></main><script>const buttons=[...document.querySelectorAll('nav button')];function activate(button){for(const item of buttons){const active=item===button;document.getElementById(item.dataset.view).hidden=!active;if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current')}document.querySelector('#nav-status').textContent='当前视图：'+button.textContent}buttons.forEach((button,index)=>{button.addEventListener('click',()=>activate(button));button.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();activate(buttons[next])})});</script></body></html>
