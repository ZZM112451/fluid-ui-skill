<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务资料库 · 青叶工作台</title><style>:root{font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f4f8f5;--accent:#176b45;--muted:#53675b;--line:#cbdad0}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid var(--line);border-radius:16px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #82998b;border-radius:8px;background:white;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:white;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #183fce;outline-offset:3px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:16px}.status{min-height:28px;margin-top:16px}.error{color:#a12620}.success{color:#176b45}a{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--accent);color:white}section[hidden]{display:none}dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid var(--line);border-radius:16px;color:inherit}dialog::backdrop{background:#12281c88}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:600}.table-wrap{overflow:auto}details{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}summary{cursor:pointer;min-height:32px;font-weight:600}details p{margin:16px 0 0}small{font-size:14px}.pill{display:inline-block;padding:0 8px;background:#e1f1e6;border-radius:16px}button,input,summary{transition:background-color .15s ease,border-color .15s ease}@media(max-width:480px){body{padding:16px 8px}main,dialog{padding:24px 16px}h1{font-size:24px}th,td{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><p class="muted">青叶工作台 / 交互实验</p><h1>任务资料库</h1><p class="muted">搜索资料，展开查看检查标准。搜索不改变已展开状态。</p><label for="search">搜索任务</label><input id="search" type="search" placeholder="搜索名称或内容"><p id="count" class="status" role="status"></p><section id="cards" aria-label="任务资料"><details data-title="表单错误提示"><summary>表单错误提示</summary><p>错误内容说明具体问题，并通过文本与语义属性同时传达。修正输入后清除过期提示。</p><p><label for="note">复核笔记</label><input id="note" placeholder="记录复核结果"></p></details><details data-title="移动端导航"><summary>移动端导航</summary><p>触控区域至少 44 像素，当前页面有可见标记，切换视图时保留业务状态。</p></details><details data-title="异步提交"><summary>异步提交</summary><p>请求失败显示失败，允许重试。重复点击不会发起多个并行请求。</p></details></section><p id="empty" hidden>没有匹配的资料，请尝试其他关键词。</p></main><script>const cards=[...document.querySelectorAll('details')],input=document.querySelector('#search');function filter(){const q=input.value.trim().toLocaleLowerCase();let count=0;for(const card of cards){card.hidden=!card.textContent.toLocaleLowerCase().includes(q);if(!card.hidden)count++}document.querySelector('#count').textContent='找到 '+count+' 项资料';document.querySelector('#empty').hidden=count>0}input.addEventListener('input',filter);filter();</script></body></html>
