<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目任务 · 青叶工作台</title><style>:root{font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f4f8f5;--accent:#176b45;--muted:#53675b;--line:#cbdad0}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid var(--line);border-radius:16px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #82998b;border-radius:8px;background:white;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:white;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #183fce;outline-offset:3px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:16px}.status{min-height:28px;margin-top:16px}.error{color:#a12620}.success{color:#176b45}a{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--accent);color:white}section[hidden]{display:none}dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid var(--line);border-radius:16px;color:inherit}dialog::backdrop{background:#12281c88}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:600}.table-wrap{overflow:auto}details{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}summary{cursor:pointer;min-height:32px;font-weight:600}details p{margin:16px 0 0}small{font-size:14px}.pill{display:inline-block;padding:0 8px;background:#e1f1e6;border-radius:16px}button,input,summary{transition:background-color .15s ease,border-color .15s ease}@media(max-width:480px){body{padding:16px 8px}main,dialog{padding:24px 16px}h1{font-size:24px}th,td{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><p class="muted">青叶工作台 / 交互实验</p><h1>项目任务</h1><p class="muted">筛选当前任务并更新完成状态。</p><label for="filter">任务状态</label><select id="filter"><option value="all">全部任务</option><option value="open">待处理</option><option value="done">已完成</option></select><p id="count" class="status" role="status"></p><div class="table-wrap"><table><caption style="text-align:left">产品体验改版任务清单</caption><thead><tr><th scope="col">任务</th><th scope="col">负责人</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const tasks=[{id:1,title:'检查表单错误提示',owner:'林清',done:false},{id:2,title:'复核移动端导航',owner:'陈默',done:false},{id:3,title:'整理设计变量',owner:'林清',done:true},{id:4,title:'测试弹窗键盘操作',owner:'许舟',done:false}];const filter=document.querySelector('#filter');function render(){const visible=tasks.filter(t=>filter.value==='all'||(filter.value==='done')===t.done),body=document.querySelector('#rows');body.replaceChildren();for(const t of visible){const row=document.createElement('tr');for(const value of [t.title,t.owner,t.done?'已完成':'待处理']){const td=document.createElement('td');td.textContent=value;row.append(td)}const td=document.createElement('td'),button=document.createElement('button');button.textContent=t.done?'重新打开':'标记完成';button.setAttribute('aria-label',button.textContent+'：'+t.title);button.addEventListener('click',()=>{t.done=!t.done;render();document.querySelector('#filter').focus()});td.append(button);row.append(td);body.append(row)}if(!visible.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=4;cell.textContent='没有符合筛选条件的任务。';row.append(cell);body.append(row)}document.querySelector('#count').textContent='显示 '+visible.length+' 项，共 '+tasks.length+' 项；已完成 '+tasks.filter(t=>t.done).length+' 项。'}filter.addEventListener('change',render);render();</script></body></html>
