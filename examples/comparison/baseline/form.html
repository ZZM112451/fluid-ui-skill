<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订阅每周项目简报 · 青叶工作台</title><style>:root{font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f4f8f5;--accent:#176b45;--muted:#53675b;--line:#cbdad0}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid var(--line);border-radius:16px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #82998b;border-radius:8px;background:white;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:white;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #183fce;outline-offset:3px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:16px}.status{min-height:28px;margin-top:16px}.error{color:#a12620}.success{color:#176b45}a{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--accent);color:white}section[hidden]{display:none}dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid var(--line);border-radius:16px;color:inherit}dialog::backdrop{background:#12281c88}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:600}.table-wrap{overflow:auto}details{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}summary{cursor:pointer;min-height:32px;font-weight:600}details p{margin:16px 0 0}small{font-size:14px}.pill{display:inline-block;padding:0 8px;background:#e1f1e6;border-radius:16px}button,input,summary{transition:background-color .15s ease,border-color .15s ease}@media(max-width:480px){body{padding:16px 8px}main,dialog{padding:24px 16px}h1{font-size:24px}th,td{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><p class="muted">青叶工作台 / 交互实验</p><h1>订阅每周项目简报</h1><p class="muted">每周一封，随时退订。此演示不发送真实邮件。</p><form id="subscribe" novalidate class="stack"><div><label for="email">邮箱地址</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><small id="email-error" class="error"></small></div><div><label for="outcome">演示请求结果</label><select id="outcome"><option value="success">成功</option><option value="failure">失败</option></select></div><div class="row"><button class="primary" id="submit">订阅简报</button><button type="button" id="cancel" hidden>取消请求</button></div></form><p id="status" class="status" role="status" aria-live="polite"></p></main><script>const form=document.querySelector('#subscribe'),email=document.querySelector('#email'),error=document.querySelector('#email-error'),status=document.querySelector('#status'),submit=document.querySelector('#submit'),cancel=document.querySelector('#cancel');let timer=null,request=0;email.addEventListener('input',()=>{error.textContent='';email.removeAttribute('aria-invalid')});form.addEventListener('submit',e=>{e.preventDefault();if(timer)return;if(!email.validity.valid){error.textContent='请输入有效的邮箱地址。';email.setAttribute('aria-invalid','true');email.focus();return}const id=++request,fail=document.querySelector('#outcome').value==='failure';submit.disabled=true;cancel.hidden=false;form.setAttribute('aria-busy','true');status.className='status';status.textContent='正在订阅…';timer=setTimeout(()=>{if(id!==request)return;timer=null;submit.disabled=false;cancel.hidden=true;form.removeAttribute('aria-busy');status.className='status '+(fail?'error':'success');status.textContent=fail?'订阅失败，请稍后重试。':'订阅成功，下周见。'},650)});cancel.addEventListener('click',()=>{request++;clearTimeout(timer);timer=null;submit.disabled=false;cancel.hidden=true;form.removeAttribute('aria-busy');status.className='status';status.textContent='请求已取消。';submit.focus()});window.addEventListener('pagehide',()=>{request++;clearTimeout(timer)});</script></body></html>
