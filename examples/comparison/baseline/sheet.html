<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建项目 · 青叶工作台</title><style>:root{font:16px/1.6 system-ui,sans-serif;color:#20332b;background:#f4f8f5;--accent:#176b45;--muted:#53675b;--line:#cbdad0}*{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid var(--line);border-radius:16px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}label{display:block;margin-bottom:8px;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #82998b;border-radius:8px;background:white;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:8px;background:white;color:var(--accent);cursor:pointer}button.primary{background:var(--accent);color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #183fce;outline-offset:3px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack>*+*{margin-top:16px}.status{min-height:28px;margin-top:16px}.error{color:#a12620}.success{color:#176b45}a{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button[aria-current=page]{background:var(--accent);color:white}section[hidden]{display:none}dialog{width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:32px;border:1px solid var(--line);border-radius:16px;color:inherit}dialog::backdrop{background:#12281c88}table{border-collapse:collapse;width:100%;margin-top:24px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:600}.table-wrap{overflow:auto}details{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}summary{cursor:pointer;min-height:32px;font-weight:600}details p{margin:16px 0 0}small{font-size:14px}.pill{display:inline-block;padding:0 8px;background:#e1f1e6;border-radius:16px}button,input,summary{transition:background-color .15s ease,border-color .15s ease}@media(max-width:480px){body{padding:16px 8px}main,dialog{padding:24px 16px}h1{font-size:24px}th,td{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><p class="muted">青叶工作台 / 交互实验</p><h1>创建项目</h1><p class="muted">分两步确认名称和目标，关闭后仍保留当前草稿。</p><button class="primary" id="open">新建项目</button><p id="result" role="status" class="status"></p><dialog id="sheet" aria-labelledby="sheet-title"><form id="wizard" novalidate><h2 id="sheet-title">项目信息</h2><p id="progress" class="muted">第 1 步，共 2 步</p><div id="step-one"><label for="name">项目名称</label><input id="name" required maxlength="80" aria-describedby="name-error"><p id="name-error" class="error"></p></div><div id="step-two" hidden><label for="goal">项目目标</label><input id="goal" value="改善核心交互"><p id="review" class="muted"></p></div><div class="row"><button id="back" type="button" hidden>上一步</button><button id="next" class="primary">下一步</button><button id="close" type="button">关闭</button></div></form></dialog></main><script>const dialog=document.querySelector('#sheet'),opener=document.querySelector('#open'),name=document.querySelector('#name'),error=document.querySelector('#name-error');let step=1;function render(){document.querySelector('#step-one').hidden=step!==1;document.querySelector('#step-two').hidden=step!==2;document.querySelector('#back').hidden=step===1;document.querySelector('#next').textContent=step===1?'下一步':'创建项目';document.querySelector('#progress').textContent='第 '+step+' 步，共 2 步';document.querySelector('#review').textContent='项目：'+name.value;document.querySelector(step===1?'#name':'#goal').focus()}opener.addEventListener('click',()=>{dialog.showModal();render()});document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>opener.focus());document.querySelector('#back').addEventListener('click',()=>{step=1;render()});name.addEventListener('input',()=>{error.textContent='';name.removeAttribute('aria-invalid')});document.querySelector('#wizard').addEventListener('submit',e=>{e.preventDefault();if(step===1){if(!name.value.trim()){error.textContent='请填写项目名称。';name.setAttribute('aria-invalid','true');name.focus();return}step=2;render()}else{document.querySelector('#result').textContent='已创建项目：'+name.value.trim();dialog.close();step=1}});</script></body></html>
