<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订阅任务提醒 · Fluid UI 测试样例</title><style>:root{color-scheme:light;--background:#f5f6f3;--surface:#fff;--text:#192d25;--muted:#53665c;--accent:#166447;--error:#a32925;--border:#b7c5bb;--space:8px;--radius:12px;--duration:140ms}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:1rem/1.6 system-ui,sans-serif}main{width:min(100% - 32px,760px);margin:40px auto}header{margin-bottom:24px}.brand{font-size:.875rem;color:var(--muted)}h1{font-size:1.75rem;line-height:1.3;margin:8px 0}h2{font-size:1.125rem;margin:0 0 16px}p{margin:8px 0 16px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select,textarea{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--border);padding:8px 12px;max-width:100%;color:var(--text);background:var(--surface)}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{cursor:default;opacity:.65}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input:not([type=checkbox]),textarea{width:100%}label{display:block;margin:16px 0 8px}label.check{display:flex;align-items:center;gap:8px}input[type=checkbox]{width:20px;height:20px;min-height:20px}.hint{font-size:.875rem;color:var(--muted)}.status{min-height:1.6em;margin:16px 0 0}.error,[aria-invalid=true]{color:var(--error)}[aria-invalid=true]{border-color:var(--error)}.error-note{padding:8px 12px;border-inline-start:3px solid var(--error);background:#fff3f1}.status:empty{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}nav button[aria-current=page]{border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}[hidden]{display:none!important}dialog{border:1px solid var(--border);border-radius:16px;padding:24px;width:min(100% - 32px,480px);max-height:calc(100dvh - 32px);overflow:auto;color:var(--text);background:var(--surface)}dialog::backdrop{background:#10251b66}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px}th,td{padding:12px 8px;text-align:start;border-bottom:1px solid var(--border)}th{font-size:.875rem;color:var(--muted)}td:last-child{text-align:end;font-variant-numeric:tabular-nums}caption{text-align:start;margin-bottom:8px}details{border-top:1px solid var(--border);padding:16px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}.count{color:var(--muted);font-variant-numeric:tabular-nums}.feedback{animation:feedback var(--duration) ease-out}@keyframes feedback{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:480px){main{margin:24px auto}.panel{padding:16px}h1{font-size:1.5rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){button.primary{border:2px solid ButtonText}.error-note{border:2px solid CanvasText}}</style><main><header><div class="brand">Fluid UI / Minimal / Subtle</div><h1>订阅任务提醒</h1></header><p>每周一接收一封任务摘要。可以随时取消订阅。</p><section class="panel" aria-labelledby="form-title"><h2 id="form-title">订阅设置</h2><form novalidate><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required aria-describedby="email-hint email-error"><div id="email-hint" class="hint">例如 name@example.com</div><p id="email-error" class="error" hidden></p><label class="check"><input id="fail" type="checkbox">模拟本次请求失败</label><div class="row"><button class="primary" type="submit">订阅</button><button id="cancel" type="button" disabled>取消请求</button></div><p id="status" class="status" role="status" aria-live="polite"></p></form></section></main><script>const form=document.querySelector('form'),email=document.querySelector('#email'),submit=form.querySelector('[type=submit]'),cancel=document.querySelector('#cancel'),status=document.querySelector('#status'),error=document.querySelector('#email-error');let generation=0,controller;
function report(text,isError=false){status.textContent=text;status.classList.toggle('error-note',isError);status.classList.remove('feedback');void status.offsetWidth;status.classList.add('feedback')}
email.addEventListener('input',()=>{email.removeAttribute('aria-invalid');error.hidden=true;if(submit.disabled){generation++;controller?.abort();submit.disabled=false;cancel.disabled=true;form.removeAttribute('aria-busy');report('邮箱已修改，请重新订阅。')}else{status.textContent='';status.classList.remove('error-note')}});
form.addEventListener('submit',async event=>{event.preventDefault();if(submit.disabled)return;if(!email.validity.valid){email.setAttribute('aria-invalid','true');error.textContent='请输入有效的邮箱地址。';error.hidden=false;email.focus();return}const id=++generation;controller=new AbortController();submit.disabled=true;cancel.disabled=false;form.setAttribute('aria-busy','true');report('正在订阅…');const shouldFail=document.querySelector('#fail').checked;try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>shouldFail?reject(Error('模拟网络失败')):resolve(),500);controller.signal.addEventListener('abort',()=>{clearTimeout(timer);reject(new DOMException('已取消','AbortError'))},{once:true})});if(id!==generation)return;report('订阅成功。')}catch(err){if(id!==generation)return;if(err.name==='AbortError')report('请求已取消，邮箱已保留。');else report('订阅失败，请重试。邮箱已保留。',true)}finally{if(id===generation){submit.disabled=false;cancel.disabled=true;form.removeAttribute('aria-busy')}}});
cancel.addEventListener('click',()=>{generation++;controller?.abort();submit.disabled=false;cancel.disabled=true;form.removeAttribute('aria-busy');report('请求已取消，邮箱已保留。');submit.focus()});window.addEventListener('pagehide',()=>{generation++;controller?.abort()});</script></html>
