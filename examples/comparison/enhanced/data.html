<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务清单 · Fluid UI 测试样例</title><style>:root{color-scheme:light;--background:#f5f6f3;--surface:#fff;--text:#192d25;--muted:#53665c;--accent:#166447;--error:#a32925;--border:#b7c5bb;--space:8px;--radius:12px;--duration:140ms}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:1rem/1.6 system-ui,sans-serif}main{width:min(100% - 32px,760px);margin:40px auto}header{margin-bottom:24px}.brand{font-size:.875rem;color:var(--muted)}h1{font-size:1.75rem;line-height:1.3;margin:8px 0}h2{font-size:1.125rem;margin:0 0 16px}p{margin:8px 0 16px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select,textarea{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--border);padding:8px 12px;max-width:100%;color:var(--text);background:var(--surface)}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{cursor:default;opacity:.65}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input:not([type=checkbox]),textarea{width:100%}label{display:block;margin:16px 0 8px}label.check{display:flex;align-items:center;gap:8px}input[type=checkbox]{width:20px;height:20px;min-height:20px}.hint{font-size:.875rem;color:var(--muted)}.status{min-height:1.6em;margin:16px 0 0}.error,[aria-invalid=true]{color:var(--error)}[aria-invalid=true]{border-color:var(--error)}.error-note{padding:8px 12px;border-inline-start:3px solid var(--error);background:#fff3f1}.status:empty{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}nav button[aria-current=page]{border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}[hidden]{display:none!important}dialog{border:1px solid var(--border);border-radius:16px;padding:24px;width:min(100% - 32px,480px);max-height:calc(100dvh - 32px);overflow:auto;color:var(--text);background:var(--surface)}dialog::backdrop{background:#10251b66}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px}th,td{padding:12px 8px;text-align:start;border-bottom:1px solid var(--border)}th{font-size:.875rem;color:var(--muted)}td:last-child{text-align:end;font-variant-numeric:tabular-nums}caption{text-align:start;margin-bottom:8px}details{border-top:1px solid var(--border);padding:16px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}.count{color:var(--muted);font-variant-numeric:tabular-nums}.feedback{animation:feedback var(--duration) ease-out}@keyframes feedback{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:480px){main{margin:24px auto}.panel{padding:16px}h1{font-size:1.5rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){button.primary{border:2px solid ButtonText}.error-note{border:2px solid CanvasText}}</style><main><header><div class="brand">Fluid UI / Minimal / Subtle</div><h1>任务清单</h1></header><p>筛选任务不会修改任务状态。</p><section class="panel" aria-labelledby="list-title"><h2 id="list-title">本周工作</h2><label for="filter">筛选任务状态</label><select id="filter"><option value="all">全部</option><option value="todo">待完成</option><option value="done">已完成</option></select><p id="count" class="count" role="status"></p><div class="table-scroll" tabindex="0" aria-label="任务表，可横向滚动"><table><caption>任务与预计时间</caption><thead><tr><th scope="col">任务</th><th scope="col">状态</th><th scope="col">预计分钟</th></tr></thead><tbody></tbody></table></div><p id="empty" hidden>没有符合条件的任务。试试查看全部。</p></section></main><script>const tasks=[{name:'整理会议笔记',state:'todo',minutes:20},{name:'检查周报',state:'todo',minutes:30},{name:'归档项目资料',state:'done',minutes:15}];const filter=document.querySelector('#filter');function render(){const shown=tasks.filter(t=>filter.value==='all'||t.state===filter.value),tbody=document.querySelector('tbody');tbody.replaceChildren();for(const task of shown){const row=document.createElement('tr'),name=document.createElement('td'),state=document.createElement('td'),time=document.createElement('td');name.textContent=task.name;const button=document.createElement('button');button.textContent=task.state==='done'?'已完成':'待完成';button.setAttribute('aria-label',task.name+'：'+button.textContent+'，点击切换');button.addEventListener('click',()=>{task.state=task.state==='done'?'todo':'done';render();filter.focus()});state.append(button);time.textContent=task.minutes;row.append(name,state,time);tbody.append(row)}document.querySelector('#count').textContent='显示 '+shown.length+' 项，共 '+tasks.length+' 项；预计 '+shown.reduce((sum,t)=>sum+t.minutes,0)+' 分钟';document.querySelector('#empty').hidden=shown.length!==0}filter.addEventListener('change',render);render();</script></html>
