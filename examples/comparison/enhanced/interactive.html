<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索任务 · Fluid UI 测试样例</title><style>:root{color-scheme:light;--background:#f5f6f3;--surface:#fff;--text:#192d25;--muted:#53665c;--accent:#166447;--error:#a32925;--border:#b7c5bb;--space:8px;--radius:12px;--duration:140ms}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:1rem/1.6 system-ui,sans-serif}main{width:min(100% - 32px,760px);margin:40px auto}header{margin-bottom:24px}.brand{font-size:.875rem;color:var(--muted)}h1{font-size:1.75rem;line-height:1.3;margin:8px 0}h2{font-size:1.125rem;margin:0 0 16px}p{margin:8px 0 16px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select,textarea{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--border);padding:8px 12px;max-width:100%;color:var(--text);background:var(--surface)}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{cursor:default;opacity:.65}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input:not([type=checkbox]),textarea{width:100%}label{display:block;margin:16px 0 8px}label.check{display:flex;align-items:center;gap:8px}input[type=checkbox]{width:20px;height:20px;min-height:20px}.hint{font-size:.875rem;color:var(--muted)}.status{min-height:1.6em;margin:16px 0 0}.error,[aria-invalid=true]{color:var(--error)}[aria-invalid=true]{border-color:var(--error)}.error-note{padding:8px 12px;border-inline-start:3px solid var(--error);background:#fff3f1}.status:empty{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}nav button[aria-current=page]{border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}[hidden]{display:none!important}dialog{border:1px solid var(--border);border-radius:16px;padding:24px;width:min(100% - 32px,480px);max-height:calc(100dvh - 32px);overflow:auto;color:var(--text);background:var(--surface)}dialog::backdrop{background:#10251b66}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px}th,td{padding:12px 8px;text-align:start;border-bottom:1px solid var(--border)}th{font-size:.875rem;color:var(--muted)}td:last-child{text-align:end;font-variant-numeric:tabular-nums}caption{text-align:start;margin-bottom:8px}details{border-top:1px solid var(--border);padding:16px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}.count{color:var(--muted);font-variant-numeric:tabular-nums}.feedback{animation:feedback var(--duration) ease-out}@keyframes feedback{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:480px){main{margin:24px auto}.panel{padding:16px}h1{font-size:1.5rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){button.primary{border:2px solid ButtonText}.error-note{border:2px solid CanvasText}}</style><main><header><div class="brand">Fluid UI / Minimal / Subtle</div><h1>搜索任务</h1></header><p>搜索标题，展开后记录补充信息。</p><section class="panel" aria-labelledby="search-title"><h2 id="search-title">任务资料</h2><label for="search">搜索任务</label><input id="search" type="search" placeholder="输入任务名称"><p id="count" class="count" role="status"></p><div id="cards"><details data-title="整理会议笔记"><summary>整理会议笔记</summary><p>将本周会议的决定和后续行动整理到项目资料。</p><label for="note-1">补充说明</label><textarea id="note-1" rows="3"></textarea></details><details data-title="检查周报"><summary>检查周报</summary><p>核对本周完成事项与下周计划。</p><label for="note-2">补充说明</label><textarea id="note-2" rows="3"></textarea></details><details data-title="归档项目资料"><summary>归档项目资料</summary><p>检查资料命名并移入归档目录。</p><label for="note-3">补充说明</label><textarea id="note-3" rows="3"></textarea></details></div><p id="empty" hidden>没有找到任务。请缩短关键词。</p></section></main><script>const search=document.querySelector('#search'),cards=[...document.querySelectorAll('details')];function filter(){const query=search.value.trim().toLocaleLowerCase();let visible=0;for(const card of cards){card.hidden=!card.dataset.title.toLocaleLowerCase().includes(query);if(!card.hidden)visible++}document.querySelector('#count').textContent='找到 '+visible+' 项任务';document.querySelector('#empty').hidden=visible!==0}search.addEventListener('input',filter);filter();</script></html>
